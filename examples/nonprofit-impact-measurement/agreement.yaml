summary: |
  Riverbend wants to show funders and its board what its network achieves, without adding
  work for its pantries. We propose a five-month engagement to choose a small set of
  measures, collect them with the tools Riverbend already uses, and hand over a simple,
  sustainable process.
background: |
  Riverbend coordinates 40 volunteer-run pantries. Each pantry keeps its own sign-in sheets,
  and the network reports only pounds of food distributed. Two funders have asked for
  evidence of outcomes, such as households served regularly and referrals to other services.

  Staff time is the main constraint: Riverbend has three staff, and pantries are run by
  volunteers who will not adopt complicated tools.
objectives:
  - id: O1
    title: Agree on what to measure
    description: A short list of measures that funders and the board value and that pantries can collect.
  - id: O2
    title: Collect it without new burden
    description: A collection process that fits inside two staff hours a week.
  - id: O3
    title: Tell the story
    description: A one-page impact summary that Riverbend can update each quarter.
scope:
  summary: The engagement covers measurement design, a pilot in five pantries, and handoff.
  included:
    - id: S1
      title: Current-state review
      description: Review sign-in sheets, the distribution log, and current funder reports.
    - id: S2
      title: Measure selection
      description: Interviews with staff, three pantry leads, and two funders; a scored shortlist.
    - id: S3
      title: Pilot
      description: Run the new collection process in five pantries for eight weeks.
    - id: S4
      title: Handoff
      description: Written procedures and a training session for staff.
  excluded:
    - id: X1
      title: Software development
      description: No custom applications or databases; the work uses Riverbend's existing spreadsheets.
    - id: X2
      title: Ongoing data collection
      description: Riverbend staff and pantries collect the data; the team coaches.
    - id: X3
      title: Grant writing
      description: The team provides the impact summary, not grant applications.
approach: |
  We start from the data Riverbend already has, pilot early, and adjust from what the pilot
  shows before handing over.
phases:
  - id: P1
    title: Discover
    start: "2026-03-16"
    end: "2026-04-24"
    goal: Learn the current state and agree on measures.
  - id: P2
    title: Pilot
    start: "2026-04-27"
    end: "2026-06-19"
    goal: Run the process in five pantries.
  - id: P3
    title: Hand off
    start: "2026-06-22"
    end: "2026-07-31"
    goal: Adjust, document, and train.
deliverables:
