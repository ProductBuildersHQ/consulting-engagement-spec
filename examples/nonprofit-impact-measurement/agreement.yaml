governance:
  summary: The Project Leader is the single point of contact for the team; the Programs Manager is the contact for Riverbend.
  meetings:
    - title: Check-in
      participants: Project Leader and Programs Manager
      frequency: Weekly
      duration: 30 minutes
    - title: Milestone review
      participants: Both teams and the Executive Director
      frequency: At each milestone
      duration: 60 minutes
assumptions:
  - id: A1
    description: Pantry sign-in sheets record a household identifier or name.
  - id: A2
    description: The Programs Manager can give about one hour a week to the project.
risks:
  - id: K1
    description: Pantries do not return pilot data on time.
    mitigation: Choose pilot pantries with reliable leads; send a weekly reminder.
    owner: riverbend
  - id: K2
    description: Funders want outcomes that take longer than five months to show.
    mitigation: Present the engagement as building the system and a baseline, not proving impact.
    owner: northfield
successCriteria:
  - id: C1
    description: Riverbend approves a measure set of six to eight measures.
  - id: C2
    description: Staff run collection for the pilot pantries within two hours a week.
acceptance:
  process: The team sends each deliverable to the Programs Manager, who returns one set of consolidated comments. The team revises once; the Executive Director accepts it at the next milestone.
  reviewDays: 5
commercials:
  model: pro_bono
  summary: The team volunteers its time. Riverbend pays no fees.
  expenses: None expected. Any expense needs Riverbend's written approval before it is incurred.
changeControl: |
  Either party may propose a change to scope, schedule, or deliverables in writing. The
  Project Leader and the Executive Director agree to it by email, and the next version of
  this document records it.
terms:
  - id: T1
    title: Confidentiality
    text: The team keeps Riverbend's data and documents confidential and uses them only for this engagement.
  - id: T2
    title: Ownership of work product
    text: Riverbend owns the deliverables and may use, change, and share them freely.
  - id: T3
    title: Ending the engagement
    text: Either party may end the engagement with two weeks' written notice.
openQuestions:
  - id: Q1
    question: Which two funders should the team interview?
    owner: dana-lee
    due: "2026-03-20"
